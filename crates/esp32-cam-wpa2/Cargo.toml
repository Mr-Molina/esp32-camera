[package]
name = "esp32-cam-wpa2"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Pure-Rust WPA2 supplicant and crypto primitives for ESP32-WROVER"

[dependencies]

[features]
default = ["c-supplicant-ffi"]
c-supplicant-ffi = []

[dev-dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
static_mut_refs = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
