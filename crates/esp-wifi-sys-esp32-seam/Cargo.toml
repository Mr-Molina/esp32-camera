[package]
name = "esp-wifi-sys-esp32"
version = "0.3.0"
edition = "2021"
links = "esp_wifi_sys_esp32"
publish = false
license = "MIT OR Apache-2.0"
description = "Seam crate patching esp-wifi-sys-esp32 0.3.0 with pure-Rust RF/clock/NVS/printf replacements linking only libphy"
build = "build.rs"

[lib]
# Upstream bindgen C Doxygen comments in `include.rs` contain indented prose
# and C snippets that `rustdoc --test` misparses as Rust doctests.
doctest = false

[features]
default = []
sys-logs = []
defmt = ["dep:defmt"]
log = ["dep:log"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
esp32-cam-rf-clock = { path = "../esp32-cam-rf-clock" }
log = { version = "0.4.25", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
static_mut_refs = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
