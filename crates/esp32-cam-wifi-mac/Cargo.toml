[package]
name = "esp32-cam-wifi-mac"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"
description = "Pure-Rust ESP32 802.11 STA MAC, LMAC DMA, and smoltcp phy adapter"

[dependencies]
esp32-cam-wpa2 = { path = "../esp32-cam-wpa2", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-dhcpv4", "iface-max-addr-count-2"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-phy = { version = "0.3.0", features = ["esp32"] }
esp-wifi-sys-esp32 = "0.3.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
static_mut_refs = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
