# cargo-deny configuration for esp32-camera workspace

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "xtensa-esp32-none-elf" },
]

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml is unmaintained (via serde_yaml / esp-config)
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
