[workspace]
resolver = "2"
members = [
    "crates/esp32-cam-types",
    "crates/esp32-cam-sccb",
    "crates/esp32-cam-sensors",
    "crates/esp32-cam-conversions",
    "crates/esp32-cam-ll",
    "crates/esp32-cam-hal",
    "crates/klipper-cam-fw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
static_mut_refs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
esp32-cam-types = { path = "crates/esp32-cam-types" }
esp32-cam-sccb = { path = "crates/esp32-cam-sccb" }
esp32-cam-sensors = { path = "crates/esp32-cam-sensors" }
esp32-cam-conversions = { path = "crates/esp32-cam-conversions" }
esp32-cam-ll = { path = "crates/esp32-cam-ll" }
esp32-cam-hal = { path = "crates/esp32-cam-hal" }
embedded-hal = { version = "1.0.0", default-features = false }

