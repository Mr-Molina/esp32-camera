name: Pre-Commit Checks

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The cargo-fmt hook runs under rust-toolchain.toml, which pins 1.99.1
      # with rustfmt and clippy. Installing only "stable + rustfmt" here left
      # rustup to auto-install the pinned toolchain mid-hook, and on some
      # runner images that fails with "detected conflict: 'bin/cargo-clippy'".
      # Install exactly what the pin asks for, as the host job does, so there
      # is nothing left for rustup to fetch when the hook runs.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                pre-commit run --from-ref HEAD~1 --to-ref HEAD
              else
                pre-commit run --all-files
              fi
            else
              pre-commit run --from-ref "$BEFORE" --to-ref "${{ github.sha }}"
            fi
          fi
