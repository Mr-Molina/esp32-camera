name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit & Integration tests
        run: cargo test --workspace --locked

      - name: Cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  miri:
    name: Miri Undefined Behavior Checks
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins 1.99.1, which has no miri component, and that
    # pin overrides the nightly the step below installs. Select nightly
    # explicitly, as the xtensa job does for `esp`.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri tests
        run: cargo miri test -p esp32-cam-ll -p esp32-cam-conversions -p esp32-cam-types

  xtensa:
    name: Xtensa ESP32 Build & Size Gate
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: esp
      # WP-09 (BUILD-07): build.rs refuses an Xtensa release build whose OTA
      # token is unset or the public default, or whose WIFI_PASS is empty.
      # These CI-only placeholders satisfy that gate so the size check can
      # run. They are compiled into the artifact, so the uploaded fw.bin is
      # NOT deployable to a device — it is a size-gate build only.
      WIFI_SSID: ci-placeholder
      WIFI_PASS: ci-placeholder-pass
      WIFI_OTA_TOKEN: ci-placeholder-ota-token-not-for-devices
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          version: "1.97.0.0"
          ldproxy: false

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Xtensa Clippy
        run: cargo clippy --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --workspace --release -- -D warnings

      - name: Xtensa Release Build
        run: cargo build --target xtensa-esp32-none-elf -Zbuild-std=core,alloc -p klipper-cam-fw --release

      - name: Generate firmware binary
        shell: bash
        run: |
          # espflash.toml points at firmware/bootloader_v554_gpio16.bin, the
          # GPIO16-patched bootloader that real flashing must use (BUILD-03).
          # That file is pending upload by the owner and gitignored, so it is
          # absent here. espflash 4.x reads it with a bare `?`, which the
          # serialport build reports as "Error while connecting to device"
          # (os error 2) — misleading, but it is just ENOENT on that path.
          #
          # Same tolerance the invariants job uses: package with the real
          # config when the bootloader is present, otherwise with a CI-local
          # config that keeps the repo's [flash] settings (dio / 4MB / 40MHz,
          # copied from espflash.toml at run time so they cannot drift) and
          # no bootloader. espflash then uses its bundled DIO ESP32 bootloader
          # only as the app-header template; the application segments come
          # from the ELF either way, and without --merge the output is the
          # app image alone, which is what the size gate measures.
          ELF="$GITHUB_WORKSPACE/target/xtensa-esp32-none-elf/release/klipper-cam-fw"
          OUT="$GITHUB_WORKSPACE/fw.bin"
          if [ -f firmware/bootloader_v554_gpio16.bin ]; then
            echo "GPIO16 bootloader present: packaging with the repository espflash.toml"
            espflash save-image --chip esp32 "$ELF" "$OUT"
          else
            echo "GPIO16 bootloader absent (BUILD-03, pending owner upload): packaging the app image with a CI-local config"
            CI_CFG="$RUNNER_TEMP/espflash-ci"
            mkdir -p "$CI_CFG"
            sed -n '/^\[flash\]/,$p' espflash.toml > "$CI_CFG/espflash.toml"
            echo "--- CI-local espflash.toml ---"; cat "$CI_CFG/espflash.toml"; echo "---"
            ( cd "$CI_CFG" && espflash save-image --chip esp32 "$ELF" "$OUT" )
          fi

      - name: Enforce firmware size gate (<= 0x1B0000 / 1,769,472 B)
        shell: bash
        run: |
          SIZE=$(stat -c %s fw.bin)
          MAX_SIZE=$((0x1B0000))
          echo "Firmware image size: $SIZE bytes (max allowed: $MAX_SIZE bytes / 0x1B0000)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Firmware size ($SIZE B) exceeds partition limit of 0x1B0000 ($MAX_SIZE B)"
            exit 1
          fi

      - name: Upload firmware binary (size-gate build, not deployable)
        uses: actions/upload-artifact@v4
        with:
          name: klipper-cam-fw-bin
          path: fw.bin
          if-no-files-found: error

  invariants:
    name: Cold Boot Invariants Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test & lint tooling
        run: pip install -r scripts/requirements-dev.txt

      - name: Lint Python scripts and tests
        run: ruff check scripts tests

      - name: Run script unit tests
        run: pytest tests

      - name: Verify cold boot invariants
        shell: bash
        run: |
          if [ -f firmware/bootloader_v554_gpio16.bin ]; then
            python3 scripts/verify_cold_boot_invariants.py
          else
            python3 scripts/verify_cold_boot_invariants.py --allow-missing-bootloader
          fi
