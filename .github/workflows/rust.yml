name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Stage upstream esp-wifi-sys-esp32 0.3.0 sources & 1 retained archive (phy)
        shell: bash
        run: |
          set -euo pipefail
          CRATE="$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0.crate"
          curl -fsSL "https://static.crates.io/crates/esp-wifi-sys-esp32/esp-wifi-sys-esp32-0.3.0.crate" -o "$CRATE"
          echo "c4644d49bde1bdeb3cd20fcc8c08be09f8f67af4b80123e54f665fdebd9a3358  $CRATE" | sha256sum -c -
          tar -xzf "$CRATE" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0/src/include.rs"
          echo "ESP_WIFI_SYS_ESP32_UPSTREAM_DIR=$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit & Integration tests
        run: cargo test --workspace --locked

      - name: Cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  miri:
    name: Miri Undefined Behavior Checks
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins 1.99.1, which has no miri component, and that
    # pin overrides the nightly the step below installs. Select nightly
    # explicitly, as the xtensa job does for `esp`.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri tests
        run: cargo miri test -p esp32-cam-ll -p esp32-cam-conversions -p esp32-cam-types -p esp32-cam-bootloader -p esp32-cam-rf-clock -p esp32-cam-wpa2 -p esp32-cam-wifi-mac

  xtensa:
    name: Xtensa ESP32 Build & Size Gate
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: esp
      # WP-09 (BUILD-07): build.rs refuses an Xtensa release build whose OTA
      # token is unset or the public default, or whose WIFI_PASS is empty.
      # These CI-only placeholders satisfy that gate so the size check can
      # run. They are compiled into the artifact, so the uploaded fw.bin is
      # NOT deployable to a device — it is a size-gate build only.
      WIFI_SSID: ci-placeholder
      WIFI_PASS: ci-placeholder-pass
      WIFI_OTA_TOKEN: ci-placeholder-ota-token-not-for-devices
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Xtensa toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          version: "1.97.0.0"
          ldproxy: false

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Stage upstream esp-wifi-sys-esp32 0.3.0 sources & 1 retained archive (phy)
        shell: bash
        run: |
          set -euo pipefail
          CRATE="$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0.crate"
          curl -fsSL "https://static.crates.io/crates/esp-wifi-sys-esp32/esp-wifi-sys-esp32-0.3.0.crate" -o "$CRATE"
          echo "c4644d49bde1bdeb3cd20fcc8c08be09f8f67af4b80123e54f665fdebd9a3358  $CRATE" | sha256sum -c -
          tar -xzf "$CRATE" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0/src/include.rs"
          echo "ESP_WIFI_SYS_ESP32_UPSTREAM_DIR=$RUNNER_TEMP/esp-wifi-sys-esp32-0.3.0" >> "$GITHUB_ENV"

      - name: Xtensa Clippy
        run: cargo clippy --target xtensa-esp32-none-elf -Zbuild-std=core,alloc --workspace --release -- -D warnings

      - name: Xtensa Release Build
        run: cargo build --target xtensa-esp32-none-elf -Zbuild-std=core,alloc -p klipper-cam-fw --release

      - name: Build pure-Rust 2nd-stage bootloader
        run: cargo xtask build-bootloader

      - name: Verify cold boot invariants (with built bootloader)
        run: cargo xtask verify-invariants

      - name: Generate firmware binary
        shell: bash
        run: |
          # espflash.toml points directly at target/xtensa-esp32-none-elf/release/esp32-cam-bootloader.bin
          # produced by `cargo xtask build-bootloader` above (no legacy C bootloader blob).
          ELF="$GITHUB_WORKSPACE/target/xtensa-esp32-none-elf/release/klipper-cam-fw"
          OUT="$GITHUB_WORKSPACE/fw.bin"
          espflash save-image --chip esp32 "$ELF" "$OUT"

      - name: Enforce firmware size gate (<= 0x1B0000 / 1,769,472 B)
        shell: bash
        run: |
          SIZE=$(stat -c %s fw.bin)
          MAX_SIZE=$((0x1B0000))
          echo "Firmware image size: $SIZE bytes (max allowed: $MAX_SIZE bytes / 0x1B0000)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: Firmware size ($SIZE B) exceeds partition limit of 0x1B0000 ($MAX_SIZE B)"
            exit 1
          fi

      - name: Upload firmware binary (size-gate build, not deployable)
        uses: actions/upload-artifact@v4
        with:
          name: klipper-cam-fw-bin
          path: fw.bin
          if-no-files-found: error

  invariants:
    name: Cold Boot Invariants Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify cold boot invariants
        run: cargo xtask verify-invariants --allow-missing-bootloader

      - name: Verify pure-Rust workspace invariants
        run: cargo xtask verify-pure-rust --allow-phase1
